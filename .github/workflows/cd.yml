name: Continuous Deployment
run-name: ${{ github.actor }} is cd out GitHub Actions 🚀
on:
  workflow_run:
    workflows:
      - Continues Integration
    types:
      - completed
    branches:
      - main
      - master

jobs:
  cd-pipeline:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend-service:${{ github.event.workflow_run.head_sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "Start deploying EC2 ..."
            cd /home/ubuntu
            sudo bash -c "sed -i 's/IMAGE_TAG=.*/IMAGE_TAG=${{ github.event.workflow_run.head_sha }}/' /home/ubuntu/.env"
            sudo docker compose pull backend-service  
            sudo docker compose up -d backend-service
            sudo docker image prune -f
            echo "Deploying EC2 completed."